name: Build Element X iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Explore project structure
      run: |
        echo "========================================="
        echo "Current directory contents:"
        echo "========================================="
        ls -la
        
        echo ""
        echo "========================================="
        echo "Looking for Xcode files:"
        echo "========================================="
        find . -name "*.xcworkspace" -o -name "*.xcodeproj" -o -name "Package.swift" | head -30
        
        echo ""
        echo "========================================="
        echo "Looking for project files:"
        echo "========================================="
        ls -la *.xc* 2>/dev/null || echo "No .xc files in root"
        
        echo ""
        echo "========================================="
        echo "Subdirectories:"
        echo "========================================="
        ls -d */ 2>/dev/null | head -20
        
        echo ""
        echo "========================================="
        echo "Check for Swift Package:"
        echo "========================================="
        cat Package.swift 2>/dev/null || echo "No Package.swift in root"
        
        echo ""
        echo "========================================="
        echo "Tree structure (2 levels):"
        echo "========================================="
        find . -maxdepth 2 -type d | head -50
