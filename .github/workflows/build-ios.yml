name: Build Element X iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'
    
    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        pod install
    
    - name: Build
      run: |
        xcodebuild clean build \
          -workspace ElementX.xcworkspace \
          -scheme ElementX \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator'
